- insert:
    - id: short-drama
      name: 'dsh-short-drama'
      config:
        # Gemini 连接是自动的：插件按 geminiApiKeyEnv、GEMINI_API_KEY、
        # GOOGLE_API_KEY 等候选引用依次探测 DSH 凭据库与环境变量，复用到已存过的 Key；
        # 也可在面板里粘贴一次，存入凭据库（不进本配置文件）。模型列表直接从 API 拉取。
        geminiProvider: google
        geminiModel: gemini-2.5-pro
        geminiApiKeyEnv: GEMINI_API_KEY
        geminiBaseURL: https://generativelanguage.googleapis.com/v1beta
        # 两个官方出片 CLI。路径由插件自动探测（PATH、~/.local/bin、npm 全局目录），
        # 这里不必填；下面两项仅作为自动探测失败时的兜底命令名。
        # 小云雀 = Pippit CLI：npm i -g @pippit-dev/cli，二进制 pippit-tool-cli，首次 login。
        # 即梦 = 官方 dreamina CLI：curl -fsSL https://jimeng.jianying.com/cli | bash，
        #        首次 login --headless（出片需高级会员）。
        xiaoyunqueCommand: pippit-tool-cli
        dreaminaCommand: dreamina
        # 提交视频时的默认值，可在面板里逐单覆盖。
        defaultRatio: '9:16'
        defaultDuration: 5
        # 出片模型由插件直接问 CLI（model list / -h）得到并在面板里下拉选择，
        # 这里只是上次选中的值；留空则自动选列表里的第一个。
        xiaoyunqueModel: ''
        dreaminaModelVersion: seedance2.0mini
        # 分辨率：两者都支持 720p；即梦 seedance2.0_vip 才支持 1080p/4k。
        xiaoyunqueResolution: '720p'
        dreaminaResolution: '720p'
        # 相对路径落在工作区内；绝对路径直接使用。
        downloadFolder: generated-videos
        # 分镜词文件夹：storyboard_write 按序号写成 NNN.md + index.json，
        # video_submit 用 number 参数与之一一对应。相对路径落在工作区内。
        storyboardFolder: storyboards
        assetExtensions:
          - .png
          - .jpg
          - .jpeg
          - .webp
          - .mp4
          - .mov
          - .mp3
          - .wav
        # 分镜词规则：改写这一段即可让面板按你的分镜规范输出。
        storyboardPreset: |
          你是一位资深短剧分镜师。请把用户提供的剧本转换为可直接用于 AI 视频生成的分镜词列表。
          要求：
          1. 按镜头顺序输出，每个镜头包含：镜头编号、景别、画面描述、台词/旁白、时长(秒)、情绪氛围、所需资产、备注。
          2. 画面描述必须具体、可视化，写清主体、动作、运镜、光线与氛围。
          3. 单镜头不超过 15 秒，时长总和应与剧本长度匹配。
          4. 使用 Markdown 表格输出，表头固定为：镜头 | 景别 | 画面 | 台词 | 时长 | 氛围 | 资产 | 备注。
          5. 只输出表格，不要输出任何解释文字。
